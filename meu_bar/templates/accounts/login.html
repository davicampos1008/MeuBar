{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="max-w-md w-full mx-auto minimal-card p-8 sm:p-10 my-auto">
    <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-3xl mb-4 shadow-inner">
            <img src="{% static 'images/logo.png' %}" alt="Logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" class="w-full h-full object-cover rounded-2xl">
            <span style="display:none;">🍹</span>
        </div>
        <h2 class="text-2xl font-black text-amber-400 tracking-tight">Bem-vindo ao Meu Bar</h2>
        <p class="text-xs text-slate-400 mt-1">Acesse sua conta para gerenciar receitas e comandas</p>
    </div>

    <form method="POST" class="space-y-5">
        {% csrf_token %}
        
        <div>
            <label class="form-label">Usuário</label>
            <input type="text" name="username" required autofocus class="form-input" placeholder="Digite seu nome de usuário">
        </div>

        <div>
            <label class="form-label">Senha</label>
            <input type="password" name="password" required class="form-input" placeholder="••••••••">
        </div>

        {% if form.errors %}
        <p class="text-xs text-rose-400 text-center font-medium bg-rose-500/10 p-2.5 rounded-xl border border-rose-500/20">
            Usuário ou senha incorretos. Verifique seus dados.
        </p>
        {% endif %}

        <button type="submit" class="w-full btn-gold py-3.5 text-sm mt-2">Entrar no Sistema</button>
    </form>

    <div class="text-center mt-8 pt-6 border-t border-slate-800/80">
        <p class="text-xs text-slate-400">Ainda não tem uma conta? <a href="{% url 'register' %}" class="text-amber-400 font-bold hover:underline">Cadastre-se</a></p>
    </div>
</div>
{% endblock %}
